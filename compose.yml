services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: veriora
      POSTGRES_USER: veriora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in your environment or root .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - veriora-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veriora -d veriora"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  veriora-postgres:
