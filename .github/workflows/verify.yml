name: Verify
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: veriora_ci
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: veriora_ci
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U veriora_ci -d veriora_ci" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://veriora_ci:synthetic_ci_only@localhost:5432/veriora_ci
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: python -m pip install -r backend/requirements.lock
      - run: python -m pip install --no-deps -e backend
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m pytest -q
        working-directory: backend
      - run: python -m ruff check app tests
        working-directory: backend
      - run: python -m alembic upgrade head
        working-directory: backend
      - run: python -m alembic check
        working-directory: backend
      - run: python -m pytest tests/test_postgres.py -q
        working-directory: backend
        env:
          VERIORA_POSTGRES_TEST: '1'
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
